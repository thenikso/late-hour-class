<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Class game · projector</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/screen.css" />
  </head>
  <body>
    <div class="stage">
      <div class="room-wrap" id="room-wrap">
        <canvas id="room"></canvas>
        <iframe class="screen-frame" id="screen" title="The shared screen" hidden></iframe>
      </div>
    </div>
    <div class="join pill" id="join">
      <span id="join-qr"></span>
      <span>Join: <b id="join-url">…</b></span>
    </div>
    <div class="banner panel" id="banner" hidden></div>
    <div class="qbar panel" id="qbar" hidden></div>
    <div class="wall panel" id="wall" hidden></div>
    <div class="board panel" id="board" hidden></div>
    <div class="spot panel" id="spot" hidden></div>
    <div class="asks panel" id="asks" hidden></div>
    <div class="klass pill classbar" id="klass" hidden></div>
    <div class="levelup panel" id="levelup" hidden></div>
    <div class="finale" id="finale" hidden></div>
    <div class="tools">
      <button class="btn small" id="sound">Sound off</button>
      <button class="btn small" id="full" title="F: the shared page fills the projector">Full screen page (F)</button>
    </div>
    <script type="module" src="js/screen.js"></script>
  </body>
</html>
